<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FocusSpace — Ambient Soundscape & Mood Mixer</title>
<style>
  /* ── Reset & Base ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-a: #0d1117;
    --bg-b: #161b22;
    --bg-c: #0d1117;
    --accent: #58a6ff;
    --glass-bg: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.10);
    --glass-active: rgba(255,255,255,0.10);
    --glow: rgba(88,166,255,0.35);
    --text: #e6edf3;
    --muted: #8b949e;
    --radius: 16px;
    --transition: 0.4s cubic-bezier(.4,0,.2,1);
  }
  html, body {
    height: 100%;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-a), var(--bg-b), var(--bg-c));
    transition: background var(--transition);
    position: relative;
  }

  /* ── Canvas Particle Layer ───────────────────────────────────────── */
  #canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.45;
  }

  /* ── Layout ───────────────────────────────────────────────────────── */
  #app {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 48px;
  }

  /* ── Header ───────────────────────────────────────────────────────── */
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 6px;
  }

  /* ── Presets Bar ──────────────────────────────────────────────────── */
  .presets {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .preset-btn {
    padding: 8px 20px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.25s;
    letter-spacing: 0.3px;
  }
  .preset-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); }
  .preset-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  /* ── Master Controls ──────────────────────────────────────────────── */
  .master-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .ctrl-btn {
    padding: 9px 22px;
    border-radius: var(--radius);
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.12); }
  .ctrl-btn.muted { background: rgba(255,80,80,0.18); border-color: rgba(255,80,80,0.5); color: #ff8080; }

  /* ── Pomodoro ─────────────────────────────────────────────────────── */
  .pomodoro {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 28px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  .pomo-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .pomo-time {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 70px;
    text-align: center;
    color: #fff;
  }
  .pomo-time.running { color: #4ade80; }
  .pomo-btn {
    padding: 5px 14px;
    border-radius: 8px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.07);
    color: var(--text);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .pomo-btn:hover { background: rgba(255,255,255,0.15); }

  /* ── Sound Grid ───────────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }

  /* ── Sound Card ───────────────────────────────────────────────────── */
  .card {
    border-radius: var(--radius);
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    padding: 22px 18px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s, background 0.3s;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.08); }
  .card.active {
    border-color: var(--card-glow, var(--accent));
    background: var(--glass-active);
    box-shadow: 0 0 24px var(--card-glow, var(--glow)), inset 0 0 12px rgba(255,255,255,0.03);
  }
  .card.active::before { opacity: 1; background: radial-gradient(ellipse at 50% 0%, var(--card-glow, var(--glow)) 0%, transparent 70%); }
  .card-icon svg { width: 44px; height: 44px; }
  .card-title {
    font-size: 0.88rem;
    font-weight: 600;
    text-align: center;
    color: var(--text);
  }
  .card-status {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: color 0.3s;
  }
  .card.active .card-status { color: var(--card-glow, var(--accent)); }

  /* ── Slider ───────────────────────────────────────────────────────── */
  .vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.12);
    outline: none;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--card-glow, var(--accent));
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: 0 0 8px var(--card-glow, var(--glow));
  }
  .vol-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
  .vol-slider::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--card-glow, var(--accent));
    border: none;
    cursor: pointer;
  }
  .card.active .vol-slider { background: rgba(255,255,255,0.22); }

  /* ── Footer ───────────────────────────────────────────────────────── */
  footer {
    text-align: center;
    margin-top: 44px;
    padding-top: 16px;
    border-top: 1px solid var(--glass-border);
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="app">
  <header>
    <h1>FocusSpace</h1>
    <p>Ambient Soundscape &amp; Mood Mixer &nbsp;·&nbsp; Procedural Audio, No Downloads</p>
  </header>

  <!-- Mood Presets -->
  <div class="presets">
    <button class="preset-btn" data-preset="midnight">🌧 Midnight Rain</button>
    <button class="preset-btn" data-preset="cabin">🔥 Cozy Cabin</button>
    <button class="preset-btn" data-preset="focus">🎯 Deep Focus</button>
  </div>

  <!-- Master Controls -->
  <div class="master-bar">
    <button class="ctrl-btn" id="btn-mute">🔇 Mute All</button>
    <button class="ctrl-btn" id="btn-reset">↺ Reset All</button>
  </div>

  <!-- Pomodoro Timer -->
  <div class="pomodoro">
    <span class="pomo-label">Pomodoro</span>
    <span class="pomo-time" id="pomo-display">25:00</span>
    <button class="pomo-btn" id="pomo-start">▶ Start</button>
    <button class="pomo-btn" id="pomo-pause">⏸ Pause</button>
    <button class="pomo-btn" id="pomo-reset">↺ Reset</button>
  </div>

  <!-- Sound Mixer Grid -->
  <div class="grid" id="sound-grid"></div>

  <footer>Made with IBM Bob</footer>
</div>

<script>
/* =============================================================
   FocusSpace — Ambient Soundscape & Mood Mixer
   Procedural audio via Web Audio API. Zero external files.
   ============================================================= */

// ── Audio Engine ──────────────────────────────────────────────
let ctx = null;          // AudioContext (lazy init on first click)
let masterGain = null;   // Master gain node
let isMuted = false;

/** Lazily initialise AudioContext; must be called from a user gesture */
function initAudio() {
  if (ctx) {
    if (ctx.state === 'suspended') ctx.resume();
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ctx.createGain();
  masterGain.gain.value = 1;
  masterGain.connect(ctx.destination);
  channels.forEach(ch => ch.build(ctx, masterGain));
}

// ── Sound Channel Definitions ─────────────────────────────────

/**
 * Generate a buffer of white noise samples.
 * @param {AudioContext} ctx
 * @param {number} seconds
 */
function makeNoiseBuffer(ctx, seconds = 4) {
  const sr = ctx.sampleRate;
  const buf = ctx.createBuffer(1, sr * seconds, sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

/**
 * Generate a buffer of brown noise (integrated white noise).
 */
function makeBrownNoiseBuffer(ctx, seconds = 4) {
  const sr = ctx.sampleRate;
  const buf = ctx.createBuffer(1, sr * seconds, sr);
  const data = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < data.length; i++) {
    const white = Math.random() * 2 - 1;
    last = (last + 0.02 * white) / 1.02;
    data[i] = last * 3.5; // amplify
  }
  return buf;
}

/**
 * Channel descriptor factory. Each channel stores its Web Audio nodes
 * and exposes build(), setVolume(), start(), stop() helpers.
 */
function createChannel(id, label, iconSvg, glowColor, builderFn) {
  return {
    id, label, iconSvg, glowColor,
    active: false,
    volume: 0,       // 0-1 current target
    gainNode: null,  // main gain node for volume ramping
    nodes: [],       // extra nodes to disconnect on teardown
    built: false,

    build(ctx, masterGain) {
      if (this.built) return;
      const g = ctx.createGain();
      g.gain.value = 0;
      g.connect(masterGain);
      this.gainNode = g;
      builderFn(ctx, g, this);
      this.built = true;
    },

    setVolume(val) {              // val: 0-1
      this.volume = val;
      if (!this.gainNode) return;
      const now = ctx.currentTime;
      this.gainNode.gain.cancelScheduledValues(now);
      this.gainNode.gain.setTargetAtTime(val, now, 0.05);
    },

    start() {
      this.active = true;
      this.setVolume(this.volume > 0 ? this.volume : 0.5);
    },

    stop() {
      this.active = false;
      this.setVolume(0);
    },

    toggle() {
      if (this.active) this.stop(); else this.start();
    }
  };
}

// ── 6 Channel Definitions ─────────────────────────────────────

const channels = [

  // 1. Heavy Rain ─────────────────────────────────────────────
  createChannel('rain', 'Heavy Rain',
    `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 30c0-7 5-13 12-13s12 6 12 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M6 34h36" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".4"/>
      <line x1="14" y1="38" x2="12" y2="44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="21" y1="38" x2="19" y2="44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="28" y1="38" x2="26" y2="44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="35" y1="38" x2="33" y2="44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>`,
    'rgba(100,160,255,0.55)',
    (ctx, out) => {
      // Pink-ish noise: white noise through two cascaded low-pass filters
      const src = ctx.createBufferSource();
      src.buffer = makeNoiseBuffer(ctx, 6);
      src.loop = true;

      const lp1 = ctx.createBiquadFilter();
      lp1.type = 'lowpass'; lp1.frequency.value = 6000; lp1.Q.value = 0.3;

      const lp2 = ctx.createBiquadFilter();
      lp2.type = 'lowpass'; lp2.frequency.value = 3000; lp2.Q.value = 0.5;

      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 400; hp.Q.value = 0.4;

      // Subtle high-freq droplet shimmer via a fast LFO on a narrow bandpass
      const dropletBP = ctx.createBiquadFilter();
      dropletBP.type = 'bandpass'; dropletBP.frequency.value = 7000; dropletBP.Q.value = 2;

      const dropletGain = ctx.createGain(); dropletGain.gain.value = 0.18;

      const dropletLFO = ctx.createOscillator();
      dropletLFO.type = 'sine'; dropletLFO.frequency.value = 4.5;
      const dropletLFOGain = ctx.createGain(); dropletLFOGain.gain.value = 0.14;
      dropletLFO.connect(dropletLFOGain); dropletLFOGain.connect(dropletGain.gain);
      dropletLFO.start();

      // Main rain path
      const mixGain = ctx.createGain(); mixGain.gain.value = 1.2;
      src.connect(lp1); lp1.connect(lp2); lp2.connect(hp); hp.connect(mixGain);

      // Droplet shimmer layer
      src.connect(dropletBP); dropletBP.connect(dropletGain);

      mixGain.connect(out); dropletGain.connect(out);
      src.start();
    }
  ),

  // 2. Deep Brown Noise ────────────────────────────────────────
  createChannel('brown', 'Deep Brown Noise',
    `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="14" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="24" cy="24" r="7"  stroke="currentColor" stroke-width="2.5" opacity=".6"/>
      <circle cx="24" cy="24" r="2"  fill="currentColor"/>
    </svg>`,
    'rgba(180,120,60,0.55)',
    (ctx, out) => {
      const src = ctx.createBufferSource();
      src.buffer = makeBrownNoiseBuffer(ctx, 8);
      src.loop = true;

      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.5;

      const lp2 = ctx.createBiquadFilter();
      lp2.type = 'lowpass'; lp2.frequency.value = 180; lp2.Q.value = 0.7;

      src.connect(lp); lp.connect(lp2); lp2.connect(out);
      src.start();
    }
  ),

  // 3. Night Wind ──────────────────────────────────────────────
  createChannel('wind', 'Night Wind',
    `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 18h26a6 6 0 0 0 0-12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M6 24h32a4 4 0 0 1 0 8H10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M6 30h20a5 5 0 0 1 0 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`,
    'rgba(140,100,220,0.55)',
    (ctx, out) => {
      const src = ctx.createBufferSource();
      src.buffer = makeNoiseBuffer(ctx, 5);
      src.loop = true;

      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 0.6;

      // Slow LFO for wind gust sweep
      const lfo = ctx.createOscillator();
      lfo.type = 'sine'; lfo.frequency.value = 0.07;

      const lfoFreqGain = ctx.createGain(); lfoFreqGain.gain.value = 500;
      lfo.connect(lfoFreqGain); lfoFreqGain.connect(bp.frequency);

      const lfoAmpGain = ctx.createGain(); lfoAmpGain.gain.value = 0.6;
      lfo.connect(lfoAmpGain); lfoAmpGain.connect(out);

      src.connect(bp); bp.connect(out);
      lfo.start(); src.start();
    }
  ),

  // 4. Ocean Waves ─────────────────────────────────────────────
  createChannel('ocean', 'Ocean Waves',
    `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 32c4-4 8-4 12 0s8 4 12 0 8-4 12 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M4 24c4-4 8-4 12 0s8 4 12 0 8-4 12 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
      <path d="M4 40c4-4 8-4 12 0s8 4 12 0 8-4 12 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
    </svg>`,
    'rgba(32,180,180,0.55)',
    (ctx, out) => {
      // Brown noise base
      const src = ctx.createBufferSource();
      src.buffer = makeBrownNoiseBuffer(ctx, 10);
      src.loop = true;

      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 1200; lp.Q.value = 0.4;

      // Slow wave LFO at 0.12 Hz
      const waveLFO = ctx.createOscillator();
      waveLFO.type = 'sine'; waveLFO.frequency.value = 0.12;

      const waveGain = ctx.createGain(); waveGain.gain.value = 0.55;
      waveLFO.connect(waveGain);
      // LFO modulates the output gain's gain
      waveGain.connect(out);

      const baseGain = ctx.createGain(); baseGain.gain.value = 0.6;
      src.connect(lp); lp.connect(baseGain); baseGain.connect(out);

      waveLFO.start(); src.start();
    }
  ),

  // 5. Fireplace Crackle ───────────────────────────────────────
  createChannel('fire', 'Fireplace Crackle',
    `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 42c-8 0-13-6-13-13 0-5 3-9 7-11-1 4 1 7 4 8-1-5 3-10 6-14 2 4 7 8 7 14 0 2-1 4-2 5 2-2 3-5 2-8 3 2 5 6 5 10 0 5-7 9-16 9Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" fill="currentColor" opacity=".25"/>
    </svg>`,
    'rgba(255,140,40,0.55)',
    (ctx, out) => {
      // ── Warm rumble base ─
      const rumbleSrc = ctx.createBufferSource();
      rumbleSrc.buffer = makeBrownNoiseBuffer(ctx, 5);
      rumbleSrc.loop = true;

      const rumbleLp = ctx.createBiquadFilter();
      rumbleLp.type = 'lowpass'; rumbleLp.frequency.value = 220; rumbleLp.Q.value = 0.8;

      const rumbleGain = ctx.createGain(); rumbleGain.gain.value = 0.55;
      rumbleSrc.connect(rumbleLp); rumbleLp.connect(rumbleGain); rumbleGain.connect(out);
      rumbleSrc.start();

      // ── Crackle impulses ─ (randomised sparse noise bursts)
      function schedulecrackle() {
        if (!ctx) return;
        const delay = 0.08 + Math.random() * 0.4;  // 80–480 ms between pops
        const when = ctx.currentTime + delay;

        const crackleBuf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.012), ctx.sampleRate);
        const data = crackleBuf.getChannelData(0);
        // Short sharp burst with exponential decay
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.3));
        }

        const snap = ctx.createBufferSource();
        snap.buffer = crackleBuf;

        const snapHp = ctx.createBiquadFilter();
        snapHp.type = 'highpass'; snapHp.frequency.value = 2000;

        const snapGain = ctx.createGain();
        snapGain.gain.value = 0.3 + Math.random() * 0.5;

        snap.connect(snapHp); snapHp.connect(snapGain); snapGain.connect(out);
        snap.start(when);
        snap.onended = schedulecrackle;
      }
      schedulecrackle();
    }
  ),

  // 6. Focus Binaural Tone ─────────────────────────────────────
  createChannel('binaural', 'Focus Binaural',
    `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="10" stroke="currentColor" stroke-width="2.5"/>
      <path d="M8 24a16 16 0 0 1 32 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      <path d="M4 24a20 20 0 0 1 40 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"/>
      <circle cx="24" cy="24" r="3" fill="currentColor"/>
    </svg>`,
    'rgba(80,220,160,0.55)',
    (ctx, out) => {
      // 200 Hz left ear, 210 Hz right ear → 10 Hz alpha-wave beat
      const merger = ctx.createChannelMerger(2);

      const leftOsc = ctx.createOscillator();
      leftOsc.type = 'sine'; leftOsc.frequency.value = 200;
      const leftGain = ctx.createGain(); leftGain.gain.value = 0.18;
      leftOsc.connect(leftGain); leftGain.connect(merger, 0, 0);

      const rightOsc = ctx.createOscillator();
      rightOsc.type = 'sine'; rightOsc.frequency.value = 210;
      const rightGain = ctx.createGain(); rightGain.gain.value = 0.18;
      rightOsc.connect(rightGain); rightGain.connect(merger, 0, 1);

      // Soft low-pass to remove any harshness
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 600;
      merger.connect(lp); lp.connect(out);

      leftOsc.start(); rightOsc.start();
    }
  ),

];

// ── Mood Presets ─────────────────────────────────────────────
const PRESETS = {
  midnight: {
    label: 'midnight',
    volumes: { rain: 0.70, brown: 0, wind: 0.35, ocean: 0, fire: 0, binaural: 0 },
    theme: { a: '#0a0e1a', b: '#0d1540', c: '#070c2a', accent: '#7ba4ff', glow: 'rgba(100,130,255,0.35)' }
  },
  cabin: {
    label: 'cabin',
    volumes: { rain: 0, brown: 0.40, wind: 0, ocean: 0, fire: 0.75, binaural: 0 },
    theme: { a: '#1a0e06', b: '#2d1206', c: '#120a04', accent: '#ffa040', glow: 'rgba(255,140,40,0.35)' }
  },
  focus: {
    label: 'focus',
    volumes: { rain: 0, brown: 0, wind: 0, ocean: 0.50, fire: 0, binaural: 0.30 },
    theme: { a: '#030f12', b: '#071c22', c: '#040d10', accent: '#40d4c0', glow: 'rgba(40,200,180,0.35)' }
  }
};

let activePreset = null;

function applyPreset(key) {
  initAudio();
  const preset = PRESETS[key];
  if (!preset) return;

  channels.forEach(ch => {
    const vol = preset.volumes[ch.id] ?? 0;
    const slider = document.getElementById('slider-' + ch.id);
    if (slider) slider.value = vol * 100;
    ch.volume = vol;
    if (vol > 0) {
      if (!ch.active) ch.active = true;
      ch.setVolume(vol);
    } else {
      ch.active = false;
      ch.setVolume(0);
    }
    updateCardUI(ch);
  });

  applyTheme(preset.theme);
  activePreset = key;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset === key));
  updateBg();
}

function applyTheme(t) {
  document.documentElement.style.setProperty('--bg-a', t.a);
  document.documentElement.style.setProperty('--bg-b', t.b);
  document.documentElement.style.setProperty('--bg-c', t.c);
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--glow', t.glow);
}

// ── Render Sound Cards ────────────────────────────────────────

function buildGrid() {
  const grid = document.getElementById('sound-grid');
  channels.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + ch.id;
    card.style.setProperty('--card-glow', ch.glowColor);
    card.innerHTML = `
      <div class="card-icon" style="color:${ch.glowColor.replace(/,[^,]+\)$/, ',1)')}">
        ${ch.iconSvg}
      </div>
      <div class="card-title">${ch.label}</div>
      <div class="card-status" id="status-${ch.id}">off</div>
      <input type="range" class="vol-slider" id="slider-${ch.id}"
             min="0" max="100" value="0" aria-label="${ch.label} volume" />
    `;

    // Click card area (not slider) to toggle
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('vol-slider')) return;
      initAudio();
      ch.toggle();
      const slider = document.getElementById('slider-' + ch.id);
      if (ch.active && ch.volume === 0) { ch.volume = 0.5; if (slider) slider.value = 50; }
      if (!ch.active) ch.volume = 0;
      updateCardUI(ch);
      clearPresetHighlight();
      updateBg();
    });

    // Slider interaction
    const slider = card.querySelector('.vol-slider');
    slider.style.setProperty('--card-glow', ch.glowColor);

    slider.addEventListener('input', (e) => {
      e.stopPropagation();
      initAudio();
      const val = +e.target.value / 100;
      ch.volume = val;
      if (val > 0 && !ch.active) { ch.active = true; }
      if (val === 0) { ch.active = false; }
      ch.setVolume(val);
      updateCardUI(ch);
      clearPresetHighlight();
      updateBg();
    });

    grid.appendChild(card);
  });
}

function updateCardUI(ch) {
  const card = document.getElementById('card-' + ch.id);
  const status = document.getElementById('status-' + ch.id);
  if (!card || !status) return;
  card.classList.toggle('active', ch.active);
  status.textContent = ch.active ? `${Math.round(ch.volume * 100)}%` : 'off';
}

function clearPresetHighlight() {
  activePreset = null;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

// ── Dynamic Background ────────────────────────────────────────

function updateBg() {
  // If a preset is set, theme is already applied; just ensure body gradient reflects CSS vars
  // Otherwise blend based on active channels
  if (activePreset) return;

  const rain   = channels.find(c => c.id === 'rain')?.volume   ?? 0;
  const brown  = channels.find(c => c.id === 'brown')?.volume  ?? 0;
  const wind   = channels.find(c => c.id === 'wind')?.volume   ?? 0;
  const ocean  = channels.find(c => c.id === 'ocean')?.volume  ?? 0;
  const fire   = channels.find(c => c.id === 'fire')?.volume   ?? 0;
  const bin    = channels.find(c => c.id === 'binaural')?.volume ?? 0;

  const total = rain + brown + wind + ocean + fire + bin || 1;
  const r = rain / total, br = brown / total, w = wind / total,
        oc = ocean / total, fi = fire / total, bi = bin / total;

  // Mix hues
  const h = Math.round(210*r + 30*br + 270*w + 185*oc + 20*fi + 160*bi);
  const lA = Math.max(5, Math.round(5 + 8*(r+br+w+oc+fi+bi)));
  document.documentElement.style.setProperty('--bg-a', `hsl(${h},40%,${lA}%)`);
  document.documentElement.style.setProperty('--bg-b', `hsl(${(h+20)%360},35%,${lA+3}%)`);
  document.documentElement.style.setProperty('--bg-c', `hsl(${(h+40)%360},30%,${lA-2}%)`);
}

// ── Master Controls ───────────────────────────────────────────

document.getElementById('btn-mute').addEventListener('click', () => {
  initAudio();
  isMuted = !isMuted;
  if (masterGain) {
    const now = ctx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setTargetAtTime(isMuted ? 0 : 1, now, 0.05);
  }
  const btn = document.getElementById('btn-mute');
  btn.textContent = isMuted ? '🔊 Resume All' : '🔇 Mute All';
  btn.classList.toggle('muted', isMuted);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  channels.forEach(ch => {
    ch.active = false;
    ch.volume = 0;
    if (ch.gainNode) {
      const now = ctx?.currentTime ?? 0;
      if (ctx) { ch.gainNode.gain.cancelScheduledValues(now); ch.gainNode.gain.setTargetAtTime(0, now, 0.05); }
    }
    const slider = document.getElementById('slider-' + ch.id);
    if (slider) slider.value = 0;
    updateCardUI(ch);
  });
  clearPresetHighlight();
  // Reset theme to default
  applyTheme({ a: '#0d1117', b: '#161b22', c: '#0d1117', accent: '#58a6ff', glow: 'rgba(88,166,255,0.35)' });
  updateBg();
});

// ── Preset Buttons ────────────────────────────────────────────

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
});

// ── Pomodoro Timer ────────────────────────────────────────────

const POMO_DURATION = 25 * 60; // seconds
let pomoRemaining = POMO_DURATION;
let pomoInterval = null;
let pomoRunning = false;

function formatTime(s) {
  const m = Math.floor(s / 60);
  return `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
}
function renderPomo() {
  const el = document.getElementById('pomo-display');
  el.textContent = formatTime(pomoRemaining);
  el.classList.toggle('running', pomoRunning);
}
document.getElementById('pomo-start').addEventListener('click', () => {
  if (pomoRunning) return;
  pomoRunning = true;
  pomoInterval = setInterval(() => {
    if (pomoRemaining <= 0) {
      clearInterval(pomoInterval); pomoRunning = false;
      pomoRemaining = 0; renderPomo(); return;
    }
    pomoRemaining--;
    renderPomo();
  }, 1000);
  renderPomo();
});
document.getElementById('pomo-pause').addEventListener('click', () => {
  if (!pomoRunning) return;
  clearInterval(pomoInterval); pomoRunning = false;
  renderPomo();
});
document.getElementById('pomo-reset').addEventListener('click', () => {
  clearInterval(pomoInterval); pomoRunning = false;
  pomoRemaining = POMO_DURATION;
  renderPomo();
});

// ── Canvas Particle System ────────────────────────────────────

const canvas = document.getElementById('canvas');
const pctx = canvas.getContext('2d');
let particles = [];
const PARTICLE_COUNT = 90;

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.3,
      vx: (Math.random() - 0.5) * 0.25,
      vy: Math.random() * 0.4 + 0.1,
      alpha: Math.random() * 0.5 + 0.1,
      life: Math.random()
    });
  }
}
initParticles();

function animateParticles() {
  requestAnimationFrame(animateParticles);
  pctx.clearRect(0, 0, canvas.width, canvas.height);

  // Check if any sound active
  const anyActive = channels.some(c => c.active);
  const speedMul = anyActive ? 1.4 : 0.5;

  particles.forEach(p => {
    p.x += p.vx * speedMul;
    p.y += p.vy * speedMul;

    if (p.y > canvas.height + 4) { p.y = -4; p.x = Math.random() * canvas.width; }
    if (p.x < -4) p.x = canvas.width + 4;
    if (p.x > canvas.width + 4) p.x = -4;

    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pctx.fillStyle = `rgba(255,255,255,${p.alpha * (anyActive ? 0.8 : 0.3)})`;
    pctx.fill();
  });
}
animateParticles();

// ── Build UI ──────────────────────────────────────────────────
buildGrid();
renderPomo();
</script>
